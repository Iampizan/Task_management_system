{% extends 'partial/base.html' %}

{% block content %}
<div class="form-card">
    <h2 class="mb-4">{{ title }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Task</button>
        <a href="{% url 'task_manager:task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
