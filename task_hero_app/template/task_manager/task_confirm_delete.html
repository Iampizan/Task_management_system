{% extends 'partial/base.html' %}

{% block content %}
<div class="form-card">
    <h2>Delete Task</h2>
    <p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'task_manager:task_detail' task.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
