{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand-box">
                <div class="brand-logo">T</div>
                <div>
                    <h4>TaskHero</h4>
                    <p>{{ user.username }}</p>
                </div>
            </div>

            <nav class="side-nav">
                <a href="{% url 'task_manager:task_list' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'task_manager:task_create' %}" class="nav-link">Create Task</a>
                <form action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    
                    <button type="submit" class="logout-btn nav-link ">
                        Logout
                    </button>
                </form>
                {% comment %} <a href="{% url 'users:logout' %}" class="nav-link">Logout</a> {% endcomment %}
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>My Projects / Task Board</h2>
                    <p>Organize work by status and priority</p>
                </div>
                <a href="{% url 'task_manager:task_create' %}" class="btn btn-primary">+ New Task</a>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
